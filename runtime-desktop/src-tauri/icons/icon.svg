<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- outrunner's app icon: the "o" of the wordmark the sign-in and home
       screens set in Geist Pixel Square (public/fonts), in #ededed on #0a0a0a.
       The path is the font's own glyph (38 font units a pixel, y up), scaled
       so one font pixel is 24 px and flipped. The tile follows the macOS icon
       grid: an 824 px body centred on the canvas, corners ~185 px. Regenerate
       the sizes with `bun run tauri icon src-tauri/icons/icon.svg` in
       runtime-desktop. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0a0a0a"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
