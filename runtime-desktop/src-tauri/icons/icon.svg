<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Outrunner's app icon: outrunner.sh's ">_" mark (Lucide's terminal
       glyph, drawn on a 24 px grid with a 2 px stroke) in #ededed on #0a0a0a.
       The tile follows the macOS icon grid: an 824 px body centred on the
       canvas, corners ~185 px; the glyph takes the same share of the tile as
       on the site. Regenerate the sizes with
       `bun run tauri icon src-tauri/icons/icon.svg` in runtime-desktop. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0a0a0a"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <g transform="translate(512 512) scale(20.12) translate(-12 -12)" fill="none" stroke="#ededed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m4 17 6-6-6-6"/>
    <path d="M12 19h8"/>
  </g>
</svg>
