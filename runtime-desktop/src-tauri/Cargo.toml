[package]
name = "runtime-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runtime_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-oauth = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `claude setup-token` drives an interactive terminal UI: with no PTY it
# produces no output and never exits, so a plain Command::output() hangs.
portable-pty = "0.8"
regex = "1"
# Local sessions (src/local_runtime.rs): pick the clone, mint the agent's
# HS256 tokens, and relay its HTTP calls and WebSockets for the webview.
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "macros", "time"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tauri-plugin-updater = "2"

