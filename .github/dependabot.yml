# Weekly dependency updates, kept small: one grouped minor-and-patch PR per
# ecosystem and directory, at most 3 open at a time. Semver-major bumps are
# ignored everywhere except GitHub Actions; take those on deliberately.
# Docker base images also stay on their LTS line (no odd Node majors, no
# Ubuntu interim releases).
#
# Security updates are separate: they are not grouped here, have their own
# limit of 10 open PRs, and skip the update-types ignores below. The explicit
# `versions` ignores (odd Node majors, Ubuntu interim releases) do apply to them.
#
# cli-npm is left out: its optional dependencies are this repo's own platform
# packages, pinned to the launcher's version at publish time.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /runtime-desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (desktop)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cloudflare
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (cloudflare)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /runtime-agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (runtime-agent)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /runtime-desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (desktop)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /box
      - /scripts/codex-live
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (docker)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Node: even (LTS) majors only.
      - dependency-name: node
        versions: [">= 23, < 24", ">= 25, < 26", ">= 27, < 28", ">= 29, < 30"]
      # Ubuntu: LTS (YY.04 in even years) only.
      - dependency-name: ubuntu
        versions: [">= 24.05, < 26.04", ">= 26.05, < 28.04"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deploy/vm
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Deps (docker)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Majors stay on here: action bumps are small, and staying current keeps
  # workflows off deprecated runtimes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "CI"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
