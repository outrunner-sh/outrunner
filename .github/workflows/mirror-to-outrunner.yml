# Keep immadsahin/outrunner an exact git mirror of this repo.
# On every branch/tag push or delete, force-sync all heads and tags downstream.
# Requires repo secret MIRROR_PAT: a token with Contents:write on immadsahin/outrunner.
name: Mirror to immadsahin/outrunner

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-outrunner
  cancel-in-progress: false

jobs:
  mirror:
    # Guard so a mirrored copy never runs this against itself.
    if: github.repository == 'neevai-labs/outrunner'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Mirror outrunner -> immadsahin/outrunner
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          git push --force --prune \
            "https://x-access-token:${MIRROR_PAT}@github.com/immadsahin/outrunner.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
