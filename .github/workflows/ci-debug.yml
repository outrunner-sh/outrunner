# TEMPORARY — delete before this pull request merges.
#
# CI's own logs aren't readable from this session's token (no actions:read), so
# this re-runs the same commands and reports the parts that matter as check
# annotations, which are readable. Notices, not errors, so this job stays green
# and only the real CI jobs go red. It changes nothing about the build.
name: CI debug

on:
  pull_request:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MISSIONS_PG: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: What fails, and why
        run: |
          set +e
          note () { [ -n "$1" ] && echo "::notice::$1"; }
          dump () { while IFS= read -r line; do note "$1$line"; done; }

          pnpm exec tsc --noEmit > /tmp/tsc.raw 2>&1; c=$?
          note "tsc exit=$c"
          [ "$c" = 0 ] || head -n 20 /tmp/tsc.raw | dump "tsc: "

          pnpm lint > /tmp/lint.raw 2>&1; c=$?
          note "lint exit=$c"
          [ "$c" = 0 ] || head -n 20 /tmp/lint.raw | dump "lint: "

          pnpm test > /tmp/test.raw 2>&1; c=$?
          note "test exit=$c"
          # The test runner redraws its progress with carriage returns, so the
          # raw log's newlines don't line up with its lines.
          tr '\r' '\n' < /tmp/test.raw > /tmp/test.log
          note "test log lines=$(wc -l < /tmp/test.log)"
          grep -n "^# " /tmp/test.log | tail -n 10 | dump "sum: "
          grep -n "^not ok" /tmp/test.log | head -n 6 | dump "notok: "
          awk '/^not ok/ { seen++ } seen == 1' /tmp/test.log | head -n 40 | dump "first: "
          exit 0

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build with the image's public values
        run: |
          node -e '
            const ts = require("typescript");
            const file = "cloudflare/wrangler.jsonc";
            const { config, error } = ts.parseConfigFileTextToJson(file, require("fs").readFileSync(file, "utf8"));
            if (error) throw new Error(`${file}: ${ts.flattenDiagnosticMessageText(error.messageText, " ")}`);
            const vars = config.containers?.[0]?.image_vars ?? {};
            for (const name of ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY"]) {
              if (!vars[name]) throw new Error(`${file} has no image_vars.${name}`);
              console.log(`${name}=${vars[name]}`);
            }
          ' >> "$GITHUB_ENV"
      - name: What the build says
        run: |
          set +e
          note () { [ -n "$1" ] && echo "::notice::$1"; }
          dump () { while IFS= read -r line; do note "$1$line"; done; }

          pnpm build > /tmp/build.raw 2>&1; c=$?
          note "build exit=$c"
          # Turbopack redraws its progress with carriage returns; the error text
          # is otherwise buried in one enormous line.
          tr '\r' '\n' < /tmp/build.raw > /tmp/build.log
          note "build log lines=$(wc -l < /tmp/build.log)"
          grep -n -i -m 2 -B 4 -A 30 "error\|failed" /tmp/build.log | head -n 40 | dump "err: "
          tail -n 25 /tmp/build.log | dump "tail: "
          exit 0
