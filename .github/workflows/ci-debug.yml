# TEMPORARY — delete before this pull request merges.
#
# CI's own logs aren't readable from this session's token (no actions:read), so
# this re-runs the same commands and reports their output as check annotations,
# which are readable. Notices, not errors, so this job stays green and only the
# real CI jobs go red. It changes nothing about the build.
name: CI debug

on:
  pull_request:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MISSIONS_PG: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: What fails, and why
        run: |
          set +e
          report () {
            name="$1"; log="$2"; lines="$3"
            code=$(cat "/tmp/$name.code")
            echo "::notice::$name exit=$code"
            head -n "$lines" "$log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::notice::$name: $line"
            done
          }
          pnpm exec tsc --noEmit > /tmp/tsc.log 2>&1; echo $? > /tmp/tsc.code
          report tsc /tmp/tsc.log 30
          pnpm test > /tmp/test.log 2>&1; echo $? > /tmp/test.code
          report test /tmp/test.log 30
          exit 0

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build with the image's public values
        run: |
          node -e '
            const ts = require("typescript");
            const file = "cloudflare/wrangler.jsonc";
            const { config, error } = ts.parseConfigFileTextToJson(file, require("fs").readFileSync(file, "utf8"));
            if (error) throw new Error(`${file}: ${ts.flattenDiagnosticMessageText(error.messageText, " ")}`);
            const vars = config.containers?.[0]?.image_vars ?? {};
            for (const name of ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY"]) {
              if (!vars[name]) throw new Error(`${file} has no image_vars.${name}`);
              console.log(`${name}=${vars[name]}`);
            }
          ' >> "$GITHUB_ENV"
      - name: What the build says
        run: |
          set +e
          pnpm build > /tmp/build.log 2>&1
          echo "::notice::build exit=$?"
          # The failure is at the end of a long build log.
          tail -n 40 /tmp/build.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice::build: $line"
          done
          exit 0
