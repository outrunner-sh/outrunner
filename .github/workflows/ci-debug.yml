# TEMPORARY — delete before this pull request merges.
#
# CI's own logs aren't readable from this session's token (no actions:read), so
# this re-runs the two failing commands and surfaces their output as check
# annotations, which are readable. It changes nothing about the build.
name: CI debug

on:
  pull_request:

jobs:
  tsc:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # As CI's app job: the tests that run migrations' SQL for real are skipped
    # without it, so a failure there would be invisible here otherwise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MISSIONS_PG: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The typecheck's own output
        run: |
          pnpm exec tsc --noEmit > /tmp/tsc.log 2>&1
          echo "tsc exit=$?"
          head -n 60 /tmp/tsc.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
      - name: The tests' own output
        run: |
          pnpm test > /tmp/test.log 2>&1
          echo "test exit=$?"
          grep -A 12 "^✖ failing tests" /tmp/test.log | head -n 60 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 20 /tmp/test.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit 0

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build with the image's public values
        run: |
          node -e '
            const ts = require("typescript");
            const file = "cloudflare/wrangler.jsonc";
            const { config, error } = ts.parseConfigFileTextToJson(file, require("fs").readFileSync(file, "utf8"));
            if (error) throw new Error(`${file}: ${ts.flattenDiagnosticMessageText(error.messageText, " ")}`);
            const vars = config.containers?.[0]?.image_vars ?? {};
            for (const name of ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY"]) {
              if (!vars[name]) throw new Error(`${file} has no image_vars.${name}`);
              console.log(`${name}=${vars[name]}`);
            }
          ' >> "$GITHUB_ENV"
      - name: The build's own output
        run: |
          pnpm build > /tmp/build.log 2>&1
          echo "build exit=$?"
          head -n 60 /tmp/build.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
