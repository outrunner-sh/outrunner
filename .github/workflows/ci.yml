name: CI

# Typecheck, lint, test and build the Outrunner app, its Go agent, and the
# Cloudflare worker. The worker is deliberately outside the app's pnpm workspace and
# excluded from the app's tsconfig, so this job is the only thing that checks it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-24.04
    # A Postgres for the tests that run migrations' SQL for real
    # (Missions and composer history); skipped locally without a test server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MISSIONS_PG: postgresql://postgres:postgres@localhost:5432/postgres
      COMPOSER_HISTORY_PG: postgresql://postgres:postgres@localhost:5432/postgres
      CODEX_AUTH_PG: postgresql://postgres:postgres@localhost:5432/postgres
      USAGE_LIMITS_PG: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # No version pin: pnpm/action-setup reads the pnpm version from the
      # root package.json "packageManager" field (pnpm@10.x). Pinning here too
      # makes the action error on the mismatch.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - name: Prepare shared fixture roles before parallel SQL tests
        run: psql "$CODEX_AUTH_PG" -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls;"
      - run: pnpm test

  build:
    # The production build, as the deploy runs it (Dockerfile): it refuses
    # what typecheck, lint and tests don't, such as a page whose prerender
    # samples miss a search param it reads. Caught here, not as a failed
    # deploy that leaves production on an older build.
    name: App build (next build)
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Syntactically valid public test values: build checks need no access to
      # the hosted database or deployment secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_outrunner_ci_example
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check the image's public values and read the Codex CLI version
        # The Dockerfile refuses a build without them; caught here, not as a
        # failed deploy. This job builds with the synthetic values above.
        run: node scripts/image-build-values.mjs | grep '^NEXT_PUBLIC_CODEX_CLI_VERSION=' >> "$GITHUB_ENV"
      - name: Verify the pinned public Codex CLI
        run: node scripts/verify-codex-cli.mjs "$NEXT_PUBLIC_CODEX_CLI_VERSION"
      # next build's own cache: much of a repeat build is reused.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  image:
    # The production image, built once per git tree and pushed to GHCR tagged
    # by it: a merge whose tree a pull request's run built deploys without a
    # build (deploy/plan.mjs). A pull request's run builds the tree it tests
    # (the merge with main). Ones that can't push (a fork's, Dependabot's)
    # skip, and main's run builds the tree instead.
    name: Image
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Name the image by its tree
        id: name
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/control-plane:tree-$tree" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Already built?
        id: built
        env:
          REF: ${{ steps.name.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "$REF is already built"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the public build values
        if: steps.built.outputs.built != 'true'
        run: node scripts/image-build-values.mjs >> "$GITHUB_ENV"
      # Blacksmith's builder keeps the layer cache and the Dockerfile's cache
      # mounts between runs: a typical change rebuilds only the app.
      - if: steps.built.outputs.built != 'true'
        uses: useblacksmith/setup-docker-builder@v1
      - if: steps.built.outputs.built != 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.ref }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CODEX_CLI_VERSION=${{ env.NEXT_PUBLIC_CODEX_CLI_VERSION }}
            OUTRUNNER_TREE=${{ steps.name.outputs.tree }}
      - name: Check the image starts and says its tree
        # With placeholder secrets: the server must start and answer its
        # liveness check (which touches no database) as the tree it was
        # built from. A dependency missing from the production install
        # fails here, not on the VM.
        env:
          REF: ${{ steps.name.outputs.ref }}
          TREE: ${{ steps.name.outputs.tree }}
        run: |
          docker pull --quiet "$REF"
          docker run -d --name smoke -p 127.0.0.1:8080:8080 \
            -e SUPABASE_SERVICE_ROLE_KEY=placeholder -e CREDENTIALS_ENCRYPTION_KEY=cGxhY2Vob2xkZXJwbGFjZWhvbGRlcnBsYWNlaG9sZGU= \
            -e OUTRUNNER_BUILD="$GITHUB_SHA" "$REF"
          for _ in $(seq 60); do
            if body=$(curl -fsS --max-time 3 http://127.0.0.1:8080/api/health/live 2>/dev/null); then break; fi
            sleep 1
          done
          docker logs smoke 2>&1 | tail -20
          echo "answered: ${body:-nothing}"
          node -e 'const h = JSON.parse(process.argv[1] || "{}"); if (h.ok !== true || h.tree !== process.argv[2]) { console.error("the image answered", h, "not as its tree", process.argv[2]); process.exit(1); }' "${body:-}" "$TREE"

  agent:
    name: Go agent
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runtime-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime-agent/go.mod
          cache-dependency-path: runtime-agent/go.sum
      # The import tests read a real Conductor database through sqlite3, as a
      # Mac does: fail on its absence rather than skip.
      - run: command -v sqlite3 || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  worker:
    name: Cloudflare worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Deliberately outside the app's pnpm workspace, and excluded from the
      # app's tsconfig — so this is the only thing that typechecks it.
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm check
