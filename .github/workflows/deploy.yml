name: Deploy production

# Deploys the control plane to https://app.outrunner.sh. The repository
# variable PRODUCTION_TARGET picks the host: `vm` runs the `deploy-vm` job
# (Docker Compose on the Compute Engine VM, docs/deploy-vm.md); anything else
# runs `deploy` (Cloudflare Containers, below). Both share the plan job and the
# health checks after the deploy.
#
# deploy-vm reaches the VM one of two ways. With the repository variable
# VM_SSH_HOST set, plain SSH: variables VM_SSH_HOST, VM_SSH_PORT, VM_SSH_USER
# and VM_SSH_KNOWN_HOSTS (the host's pinned key), and the secret VM_SSH_KEY.
# Otherwise Compute Engine over IAP, signed in with Workload Identity
# Federation (no stored key): variables GCP_PROJECT,
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT, from
# deploy/vm/gcp/github-deployer.sh. Either way the VM builds the image and
# keeps its runtime secrets in /etc/outrunner.
#
# Why this exists rather than deploying from a laptop: Cloudflare Containers has
# no server-side build. `wrangler deploy` builds the image with a LOCAL Docker
# and pushes it to registry.cloudflare.com, so without this the deploy depends
# on whoever's machine has a working Docker daemon that day.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - Workers Scripts:Edit, Durable Objects:Edit,
#                            Containers:Edit, and DNS:Edit on the custom-domain zones
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id (matches wrangler.jsonc)
# The public supported CLI version lives with the existing public build values
# in cloudflare/wrangler.jsonc, and is verified against npm before every deploy.
# Apply pending SQL migrations separately before deploying; the health gate
# refuses to call a missing Codex schema a successful feature rollout.
#
# Runtime secrets (Supabase, Daytona, CREDENTIALS_ENCRYPTION_KEY) are NOT set
# here. They live as Worker secrets, set once with `wrangler secret put`, and
# survive deploys — so they never pass through CI.

# Merging to main deploys to production in a couple of minutes: CI builds
# the image of every tree a pull request tests and pushes it to ghcr.io
# (ci.yml, Image), and deploy/plan.mjs ships a merge at once when a pull
# request ran green with the merge's very tree (it was up to date with main),
# from that image; the VM pulls it and switches over (deploy-vm). A merge
# that wasn't tested as is (its pull request was behind main) waits for
# main's CI first. Migrations aren't run here: apply them (`pnpm db:migrate`)
# BEFORE merging a PR that needs them.
#
# The repository variable VM_BUILD_ON_VM=true switches back to building the
# image on the VM, the old way.
#
# Rollback or redeploy: Actions -> Run workflow with `ref` set to an earlier
# main SHA; the commit must be on main and have a successful CI run on main.
# See docs/deploy-vm.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on main to deploy (an earlier one rolls back). Empty: main's head."
        required: false
        default: ""
      migrations-applied:
        description: "I ran `pnpm db:migrate` for the supabase/migrations/ this deploy adds (required when it adds any)"
        type: boolean
        default: false

# One run at a time, the whole run: one under way is never cut off, and
# GitHub keeps one waiting run, so a newer run replaces a waiting one. A run
# under way whose commit stops being main's head stands down (plan.mjs), so
# the newer run doesn't wait on it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    # Resolves what to deploy, checks it, and writes the job summary. Fails,
    # and so deploys nothing, on anything it can't vouch for.
    if: github.repository == 'outrunner-sh/outrunner'
    # Mostly waiting on GitHub's API (plan.mjs), so a small runner.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      # Which pull request a merge came from (plan.mjs).
      pull-requests: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The whole history: the summary lists commits since the last deploy.
          fetch-depth: 0

      - name: Resolve the commit to deploy
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            sha="$GITHUB_SHA"
          else
            # The `production` environment only allows main; say so plainly
            # rather than leave it to a rejected deployment.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run this workflow from main (the 'Use workflow from' menu); pick the commit with the ref input"
              exit 1
            fi
            sha=$(git rev-parse --verify "${INPUT_REF:-origin/main}^{commit}" 2>/dev/null) \
              || { echo "::error::'$INPUT_REF' is not a commit in this repository"; exit 1; }
          fi
          # Production is main's: never ship a commit main doesn't contain.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; only main's commits deploy to production"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait until it was tested as is, and its image is built
        # deploy/plan.mjs: ships a merge a pull request tested with its very
        # tree at once, waits for main's CI otherwise, and stands down when a
        # newer commit is main's head.
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BUILD_ON_VM: ${{ vars.VM_BUILD_ON_VM }}
        run: node deploy/plan.mjs

      - name: Summarize the deploy
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          EVENT: ${{ github.event_name }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations-applied }}
        run: |
          set -euo pipefail
          # What users have now: the build /api/health reports.
          live=$(curl -fsS --max-time 20 https://app.outrunner.sh/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('build') or '')" || true)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "## Production deploy of \`${SHA:0:12}\`"
            echo
            echo "Commit: [\`$SHA\`]($url/commit/$SHA)"
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$live^{commit}" 2>/dev/null; then
              echo "Live now: [\`${live:0:12}\`]($url/commit/$live)"
            else
              echo "Live now: unknown (${live:-no build reported})"
              live=""
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          migrations=""
          if [ -z "$live" ]; then
            echo "Can't tell what's live, so no commit list. **Check \`supabase/migrations/\` yourself.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Can't tell which build is live, so can't tell whether this deploy changes supabase/migrations/"
            # Health being down is when people redeploy by hand: don't let the
            # migrations gate turn off because the diff is unknown.
            if [ "$EVENT" = workflow_dispatch ] && [ "$MIGRATIONS_APPLIED" != true ]; then
              echo "::error::Can't tell which build is live (/api/health reports none), so can't tell whether this deploy changes supabase/migrations/. Nothing was deployed. Make sure pnpm db:migrate has run, then run this workflow again with migrations-applied checked."
              exit 1
            fi
          elif [ "$live" = "$SHA" ]; then
            echo "This commit is already live: this redeploys it (and restarts the container)." >> "$GITHUB_STEP_SUMMARY"
          elif git merge-base --is-ancestor "$live" "$SHA"; then
            {
              echo "### Commits since the last deploy"
              echo
              git log --no-merges --format="- [\`%h\`]($url/commit/%H) %s (%an)" "$live..$SHA"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            migrations=$(git diff --name-only --diff-filter=AM "$live" "$SHA" -- supabase/migrations/)
          else
            {
              echo "### Rollback: commits this removes from production"
              echo
              git log --no-merges --format="- [\`%h\`]($url/commit/%H) %s (%an)" "$SHA..$live"
              echo
              echo "Rolling back doesn't undo migrations; the database keeps whatever they applied."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$migrations" ]; then
            {
              echo "### ⚠️ This deploy changes migrations: \`pnpm db:migrate\` must have run"
              echo
              echo "This deploy adds or changes migrations:"
              echo
              while read -r f; do echo "- \`$f\`"; done <<< "$migrations"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This deploy changes supabase/migrations/: they should have been applied (pnpm db:migrate) before merging. If not, run it now."
            # A manual run has to say they were applied; one after CI can't
            # take input, so it warns (above) and deploys.
            if [ "$EVENT" = workflow_dispatch ] && [ "$MIGRATIONS_APPLIED" != true ]; then
              echo "::error::This deploy changes supabase/migrations/. Nothing was deployed. Run pnpm db:migrate, then run this workflow again with migrations-applied checked."
              exit 1
            fi
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && vars.PRODUCTION_TARGET != 'vm'
    # The `production` environment (Settings -> Environments) allows main
    # only and records each deploy. No required reviewers: main deploys.
    environment:
      name: production
      url: https://app.outrunner.sh
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # What ships: the commit the plan resolved (a rollback's ref, or the
      # push's commit).
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # No version pin: pnpm/action-setup reads the pnpm version from the root
      # package.json "packageManager" field. Pinning version here too makes the
      # action error on the mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify the published Codex CLI before enabling sign-in
        run: |
          # image_vars are Docker build arguments, already checked in for the
          # public Supabase values. Keep one auditable source of configuration;
          # a Worker runtime variable cannot change the browser bundle.
          version=$(node -e '
            const text = require("fs").readFileSync("cloudflare/wrangler.jsonc", "utf8");
            const matches = [...text.matchAll(/"NEXT_PUBLIC_CODEX_CLI_VERSION"\s*:\s*"([^"]+)"/g)];
            if (matches.length !== 1) throw new Error("Pin one supported NEXT_PUBLIC_CODEX_CLI_VERSION in image_vars");
            process.stdout.write(matches[0][1]);
          ')
          node scripts/verify-codex-cli.mjs "$version"

      - name: Install deploy tooling
        working-directory: cloudflare
        # --ignore-workspace: this package is deliberately outside the app's
        # pnpm workspace, so a plain install resolves nothing.
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Typecheck the worker
        working-directory: cloudflare
        # Cheap, and it has caught a real error: the app's tsconfig excludes
        # cloudflare/, so nothing else looks at this file.
        run: pnpm check

      - name: Stamp the image with the commit
        working-directory: cloudflare
        # /api/health reports it, so the Worker (and the check below) can tell
        # the running container is this deploy's. A build arg, like the
        # NEXT_PUBLIC_* ones.
        run: |
          sed -i 's/"image_vars": {/"image_vars": {\n        "OUTRUNNER_BUILD": "'"$DEPLOY_SHA"'",/' wrangler.jsonc
          grep -q "\"OUTRUNNER_BUILD\": \"$DEPLOY_SHA\"" wrangler.jsonc

      - &note-live-build
        name: Note the build live before this deploy
        # The checks below accept a later commit containing this one as
        # served, but never the build that was already live: on a rollback
        # that build contains this commit and would pass without a deploy.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          build=$(curl -fsS --max-time 20 https://app.outrunner.sh/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('build') or '')" || true)
          echo "Live before deploy: ${build:-unknown}"
          echo "PREV_BUILD=$build" >> "$GITHUB_ENV"
          # An automatic deploy never goes backwards (CI can finish out of
          # order; the plan's stand-down is checked earlier, this is now).
          # Rollbacks are manual (workflow_dispatch).
          if [ "$EVENT" = push ] && [[ "$build" =~ ^[0-9a-f]{40}$ ]] && [ "$build" != "$DEPLOY_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$build" --jq .status 2>&1 || true)
            if [ "$status" = ahead ]; then
              echo "::error::Live build $build already contains $DEPLOY_SHA; an automatic deploy won't roll it back. Roll back with Run workflow and a ref."
              exit 1
            fi
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4"
          command: deploy --var OUTRUNNER_BUILD:${{ env.DEPLOY_SHA }}

      - &wait-for-users
        name: Wait until users get this deploy
        # A deploy can succeed while the container keeps the image before it
        # (cloudflare/worker.ts): only /api/health reporting this commit says
        # users have it. The Worker replaces a container on an older build
        # within a minute or so of a request; this asks for up to 10 minutes.
        # A later deploy that got there first has this commit in it too: one
        # merged right after this one replaces it, and that's users getting it.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            build=$(curl -fsS --max-time 20 https://app.outrunner.sh/api/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('build') or '')" || true)
            if [ "$build" = "$DEPLOY_SHA" ]; then echo "Serving $DEPLOY_SHA"; exit 0; fi
            if [[ "$build" =~ ^[0-9a-f]{40}$ ]] && [ "$build" != "${PREV_BUILD:-}" ]; then
              # "ahead": the build served is a later commit with this one in it.
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$build" --jq .status 2>&1 || true)
              if [ "$status" = "ahead" ]; then echo "Serving $build, a later deploy with $DEPLOY_SHA in it"; exit 0; fi
              echo "Compared with $build: $status"
            fi
            echo "Still serving ${build:-a build from before builds were reported}"
            sleep 15
          done
          echo "::error::app.outrunner.sh still isn't serving $DEPLOY_SHA after 10 minutes"
          exit 1

      - &verify-usable
        name: Verify the deployment is actually usable
        # A deploy that returns 200 can still be broken: without
        # CREDENTIALS_ENCRYPTION_KEY the site loads, sign-in works, and every
        # credential write fails. Fail the job rather than report success.
        #
        # Anonymous /api/health only says {ok, build}; the configuration
        # report needs the BILLING_CRON_SECRET bearer (app/api/health/route.ts).
        # HEALTH_CHECK_SECRET is a repo secret holding the same value as the
        # Worker's BILLING_CRON_SECRET.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_CHECK_SECRET:-}" ]; then
            echo "::error::HEALTH_CHECK_SECRET is not set: add a repo Actions secret with the Worker's BILLING_CRON_SECRET value, or /api/health won't report configuration"
            exit 1
          fi
          body=""
          for i in $(seq 1 30); do
            # No -f: a 503 (ok=false) still carries the report worth printing.
            # But only stop on the health JSON itself; a Cloudflare 502/520
            # page or a container still starting gets retried.
            if body=$(curl -sS --max-time 20 -H "Authorization: Bearer $HEALTH_CHECK_SECRET" https://app.outrunner.sh/api/health) \
              && python3 -c "import json,sys; h=json.load(sys.stdin); sys.exit(0 if isinstance(h, dict) and 'ok' in h else 1)" <<< "$body" 2>/dev/null; then
              break
            fi
            echo "Attempt $i: no health JSON yet: ${body:0:200}"
            body=""
            sleep 10
          done
          : "${body:?/api/health never returned its JSON report}"
          echo "$body"
          build=$(python3 -c "import json,sys; print(json.load(sys.stdin).get('build') or '')" <<< "$body" || true)
          if [ "$build" != "$DEPLOY_SHA" ]; then
            # Same rule as the wait step: a later deploy containing this commit counts.
            status=""
            if [[ "$build" =~ ^[0-9a-f]{40}$ ]] && [ "$build" != "${PREV_BUILD:-}" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...$build" --jq .status 2>&1 || true)
            fi
            if [ "$status" != "ahead" ]; then
              echo "::error::health reports build '${build}', not $DEPLOY_SHA or a later commit containing it${status:+ (compare: $status)}"
              exit 1
            fi
          fi
          python3 - "$body" <<'PY'
          import json, sys
          h = json.loads(sys.argv[1])
          if "configured" not in h:
              sys.exit("::error::/api/health returned no configuration report: HEALTH_CHECK_SECRET doesn't match the Worker's BILLING_CRON_SECRET")
          c = h["configured"]
          bad = [k for k in ("supabase", "supabaseServiceRole", "credentialEncryption", "daytona") if not c.get(k)]
          if bad:
              sys.exit("::error::deployed but not usable; false: " + ", ".join(bad))
          if not h.get("ok"):
              sys.exit("::error::health reports ok=false")
          codex = h.get("codex") or {}
          if not codex.get("ready"):
              sys.exit("::error::Codex rollout incomplete: apply 20261103190000_codex_connections.sql and configure the verified CLI build version; " + str(codex))
          print("health OK:", c, codex)
          PY

  deploy-vm:
    needs: plan
    if: needs.plan.outputs.deploy == 'true' && vars.PRODUCTION_TARGET == 'vm'
    # Same environment as the Cloudflare job: main only (the queue is the
    # workflow's).
    environment:
      name: production
      url: https://app.outrunner.sh
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A pulled image takes a minute or two; one built on the VM (no image,
    # or VM_BUILD_ON_VM) up to twenty.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read # the VM pulls the image with this run's token
      id-token: write # Workload Identity Federation
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
      DEPLOY_IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # deploy.sh checks the commit is on origin/main and archives it.
          fetch-depth: 0

      - *note-live-build

      - name: Trust the VM's SSH key
        if: vars.VM_SSH_HOST != ''
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          # The host key is pinned, never learned on first use.
          : "${VM_SSH_KEY:?Set the VM_SSH_KEY secret}" "${VM_SSH_KNOWN_HOSTS:?Set the VM_SSH_KNOWN_HOSTS variable}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/outrunner_vm
          chmod 0600 ~/.ssh/outrunner_vm
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - if: vars.VM_SSH_HOST == ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - if: vars.VM_SSH_HOST == ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and activate on the VM
        # Archives the commit, builds it on the VM, and activates it only if
        # the VM's local /api/health reports this build; otherwise the VM
        # restores the release before it and this step fails.
        env:
          OUTRUNNER_VM_SSH: ${{ vars.VM_SSH_HOST != '' && format('{0}@{1}', vars.VM_SSH_USER, vars.VM_SSH_HOST) || '' }}
          OUTRUNNER_VM_SSH_PORT: ${{ vars.VM_SSH_PORT }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          # deploy.sh uses SSH when OUTRUNNER_VM_SSH is set, IAP otherwise.
          if [ -n "$OUTRUNNER_VM_SSH" ]; then export OUTRUNNER_VM_SSH_KEY="$HOME/.ssh/outrunner_vm"; fi
          # The VM pulls the tree's image with this run's token, which lasts
          # as long as the run; without an image it builds one, the old way.
          if [ -n "$DEPLOY_IMAGE" ]; then
            export OUTRUNNER_IMAGE="$DEPLOY_IMAGE" OUTRUNNER_REGISTRY_TOKEN="$REGISTRY_TOKEN"
          fi
          deploy/vm/deploy.sh "$DEPLOY_SHA"

      - *wait-for-users

      - *verify-usable
