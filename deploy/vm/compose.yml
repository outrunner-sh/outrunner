# One app slot. Activation runs this file twice over, as projects
# outrunner-blue and outrunner-green: the new release starts in the idle
# slot while the live one keeps serving, and the proxy (edge.yml) switches
# only once the new slot reports its exact build. See activate-release.sh.
services:
  app:
    image: outrunner-control-plane:${OUTRUNNER_BUILD:?Set the release SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        OUTRUNNER_BUILD: ${OUTRUNNER_BUILD:?Set the release SHA}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public Supabase key}
        NEXT_PUBLIC_CODEX_CLI_VERSION: ${NEXT_PUBLIC_CODEX_CLI_VERSION:?Set the supported CLI version}
    restart: unless-stopped
    env_file:
      - path: /etc/outrunner/runtime.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: "8080"
      RUNTIME_AGENT_BINARY_PATH: bin/runtime-agent-linux-amd64
    # Each slot has its own local port, so activation can check the new
    # slot while the live one keeps its own.
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:8080"
    networks:
      edge:
        aliases: ["app-${SLOT:-blue}"]
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health', {signal: AbortSignal.timeout(5000)}).then(async r => {const h=await r.json(); process.exit(r.ok && h.ok && h.build===process.env.OUTRUNNER_BUILD ? 0 : 1)}).catch(() => process.exit(1))"
      start_period: 60s
      interval: 15s
      timeout: 6s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    external: true
    name: outrunner
